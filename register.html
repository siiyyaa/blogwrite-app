<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogWrite | Join</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">

        <div class="header-inner">

            <a href="home.html" class="brand">
                BLOGWRITE
            </a>

            <nav class="site-nav">

                <a href="home.html">
                    Home
                </a>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="create-blog.html">
                    Write
                </a>

                <a href="login.html">
                    Sign in
                </a>

                <a href="register.html" class="join-button">
                    Join BlogWrite
                </a>

            </nav>

        </div>

    </header>


    <!-- Register -->
    <main class="auth-page">

        <section class="auth-card register-card">

            <p class="eyebrow">
                START YOUR JOURNEY
            </p>

            <h1>
                Create your<br>
                BlogWrite account.
            </h1>

            <p class="auth-description">
                Join a quiet space where your ideas can
                become stories.
            </p>


            <form id="registerForm" class="auth-form">

                <div class="form-group">

                    <label for="name">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        required
                    >

                    <span>
                        I agree to the BlogWrite terms
                        and privacy policy.
                    </span>

                </label>


                <button
                    type="submit"
                    class="button button-primary auth-button"
                >
                    Create account
                </button>

            </form>


            <p class="auth-switch">
                Already have an account?
                <a href="login.html">
                    Sign in
                </a>
            </p>

        </section>

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="footer-bottom">

            <span>© <span class="current-year"></span> BlogWrite</span>

            <span>
                Built with HTML, CSS & JavaScript
            </span>

        </div>

    </footer>


    <script src="script.js"></script>



</body>
</html>
