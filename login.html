<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogWrite | Sign In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="site-header">

        <div class="header-inner">

            <a href="home.html" class="brand">
                BLOGWRITE
            </a>

            <nav class="site-nav">

                <a href="home.html">
                    Home
                </a>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="create-blog.html">
                    Write
                </a>

                <a href="login.html" class="active">
                    Sign in
                </a>

                <a href="register.html" class="join-button">
                    Join BlogWrite
                </a>

            </nav>

        </div>

    </header>


    <!-- Login -->
    <main class="auth-page">

        <section class="auth-card">

            <p class="eyebrow">
                WELCOME BACK
            </p>

            <h1>
                Sign in to<br>
                BlogWrite.
            </h1>

            <p class="auth-description">
                Continue writing, manage your posts,
                and keep your ideas organized.
            </p>


            <form id="loginForm" class="auth-form">

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="button button-primary auth-button"
                >
                    Sign in
                </button>

            </form>


            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">
                    Create one
                </a>
            </p>

        </section>

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="footer-bottom">

           <span>© <span class="current-year"></span> BlogWrite</span>

            <span>
                Built with HTML, CSS & JavaScript
            </span>

        </div>

    </footer>
<script src="script.js"></script>

</body>
</html>
